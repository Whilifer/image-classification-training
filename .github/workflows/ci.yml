name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python 3.11)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Run linter
        run: |
          ruff check .

      - name: Run tests
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term \
            --cov-fail-under=80

  docker:
    name: Build Docker image

    runs-on: ubuntu-latest

    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t image-classifier .