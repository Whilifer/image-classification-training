experiment_name: CIFAR10-classification-docker-v2
run_name: augmentation_flip_crop_20ep

data_dir: data

batch_size: 128
epochs: 30
learning_rate: 0.001
weight_decay: 0.0001
num_workers: 0

device: auto

mlflow_tracking_uri: http://127.0.0.1:5001

augmentation:
  enabled: true
  horizontal_flip: true
  random_crop: true
  crop_padding: 4
  random_rotation: true
  rotation_degrees: 15

early_stopping:
  enabled: true
  patience: 5

scheduler:
  enabled: true
  type: cosine
  min_learning_rate: 0.00001