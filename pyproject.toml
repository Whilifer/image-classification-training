[project]
name = "image-classification-training"
version = "0.1.0"
description = "PyTorch image classification training pipeline with MLflow and Optuna"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 88
target-version = "py311"
ignore = ["B008",]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]