services:
  mlflow:
    image: python:3.11-slim

    working_dir: /mlflow

    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlartifacts

    command: >
      sh -c "
      pip install mlflow==3.15.1 anyio==3.7.1 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --allowed-hosts '*'
      "

    ports:
      - "5001:5000"

  inference:
    build: .

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    volumes:
      - ./mlartifacts:/mlartifacts:ro

    depends_on:
      - mlflow