services:
  mlflow:
    image: python:3.11-slim

    working_dir: /mlflow

    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow/mlflow.db

    command: >
      sh -c "
      pip install mlflow &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlruns
      "

    ports:
      - "5001:5000"

  inference:
    build: .

    ports:
      - "8000:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

    volumes:
      - ./mlruns:/mlruns:ro

    depends_on:
      - mlflow